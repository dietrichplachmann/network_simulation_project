name: Build and check gateway simulation
on: [push, pull_request, workflow_dispatch]

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake git python3
      - name: Build ns-3.45 and the project
        run: bash scripts/bootstrap.sh
      - name: Check multi-hop delivery and metrics
        run: ctest --test-dir build --output-on-failure
